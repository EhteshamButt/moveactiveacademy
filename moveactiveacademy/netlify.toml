[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Route all requests through the NestJS serverless function
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true
